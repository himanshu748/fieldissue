name: fieldissue

x-api-tooling: &api-tooling
  build:
    context: .
    target: development
  env_file: .env
  environment: &api-environment
    NODE_ENV: development
    DATABASE_URL: postgresql://${POSTGRES_USER:-fieldissue}:${POSTGRES_PASSWORD:-fieldissue-development-only}@db:5432/${POSTGRES_DB:-fieldissue}
    INTELLIGENCE_URL: http://intelligence:8000
    LOCAL_STORAGE_PATH: /app/.media
    PORT: "3000"
  volumes:
    - media:/app/.media
  networks:
    - backend
    - outbound

services:
  db:
    build:
      context: db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-fieldissue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-fieldissue-development-only}
      POSTGRES_DB: ${POSTGRES_DB:-fieldissue}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    # No database port is published by default. See README for host access.

  intelligence:
    build:
      context: services/intelligence
      args:
        INSTALL_TABPFN: ${INSTALL_TABPFN:-false}
    env_file: .env
    environment:
      ENVIRONMENT: development
    networks:
      - backend
      - outbound
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/ready", timeout=4)']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    # Private service: intentionally no ports mapping.

  migrate:
    <<: *api-tooling
    command: [npm, run, migrate]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-tooling
    ports:
      - "127.0.0.1:${PORT:-3000}:3000"
    volumes:
      - media:/app/.media
      - ./apps/api/src:/app/apps/api/src:ro
    depends_on:
      db:
        condition: service_healthy
      intelligence:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000/ready",{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  api-tools:
    <<: *api-tooling
    profiles: [tools]
    command: [npm, run, lint]
    depends_on:
      db:
        condition: service_healthy

  test-db:
    profiles: [tools]
    build:
      context: db
    environment:
      POSTGRES_USER: fieldissue
      POSTGRES_PASSWORD: fieldissue-test-only
      POSTGRES_DB: fieldissue_test
    tmpfs:
      - /var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U fieldissue -d fieldissue_test']
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  api-tests:
    <<: *api-tooling
    profiles: [tools]
    environment:
      <<: *api-environment
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://fieldissue:fieldissue-test-only@test-db:5432/fieldissue_test
    command: [npm, test]
    depends_on:
      test-db:
        condition: service_healthy

  python-tools:
    profiles: [tools]
    build:
      context: .
      target: intelligence-tooling
    environment:
      ENVIRONMENT: test
      AI_MOCK_MODE: "true"
      INTERNAL_SERVICE_TOKEN: development-only-change-me
    networks:
      - outbound

volumes:
  postgres:
  media:

networks:
  backend:
    internal: true
  # Outbound provider access; attaching here publishes no inbound host ports.
  outbound:
