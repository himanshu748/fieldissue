services:
  - type: web
    name: fieldissue
    runtime: docker
    plan: free
    region: virginia
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    autoDeployTrigger: checksPass
    # Keep full readiness: missing real Gemma or TabPFN must block a live deploy.
    healthCheckPath: /ready
    envVars:
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: ENVIRONMENT
        value: production
      - key: AI_MOCK_MODE
        value: "false"
      - key: API_ACCESS_TOKEN
        generateValue: true
      - key: INTERNAL_SERVICE_TOKEN
        generateValue: true
      - key: INTELLIGENCE_URL
        value: http://127.0.0.1:8000
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: "true"
      - key: STORAGE_PROVIDER
        value: s3
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: MEDIA_BASE_URL
        sync: false
      - key: GEMMA_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: GEMMA_MODEL
        value: models/gemma-4-26b-a4b-it
      - key: GEMMA_MODEL_VERSION
        value: "001"
      - key: GEMMA_API_KEY
        sync: false
      - key: AI_TIMEOUT_SECONDS
        value: "90"
      - key: AI_TOTAL_TIMEOUT_SECONDS
        value: "95"
      - key: AI_MAX_RETRIES
        value: "0"
