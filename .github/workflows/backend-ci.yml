name: Backend CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render-container:
    name: Render container boundary and lifecycle
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build Render image
        run: docker build -f Dockerfile.render -t fieldissue-render .
      - name: Refuse missing production secrets
        run: |
          if docker run --rm fieldissue-render; then
            echo "Unsafe configuration was accepted"; exit 1
          fi
      - name: Check isolation and fail-closed readiness
        # Dummy configuration tests process boundaries only, never live providers.
        run: |
          docker run -d --memory=512m --memory-swap=512m --name fieldissue-render-smoke -p 127.0.0.1:13000:10000 \
            -e PORT=10000 -e DATABASE_SSL=true -e STORAGE_PROVIDER=s3 \
            -e DATABASE_URL=postgresql://localhost/unused \
            -e API_ACCESS_TOKEN=render-ci-public-test-token-000000000000 \
            -e INTERNAL_SERVICE_TOKEN=render-ci-internal-test-token-111111111111 \
            -e GEMMA_BASE_URL=https://example.invalid/v1 \
            -e GEMMA_MODEL=gemma-4-26b-a4b-it -e GEMMA_MODEL_VERSION=ci-unavailable \
            -e GEMMA_API_KEY=ci-unavailable -e S3_BUCKET=ci-unused \
            -e S3_ACCESS_KEY_ID=ci-unused -e S3_SECRET_ACCESS_KEY=ci-unused \
            -e MEDIA_BASE_URL=https://example.invalid/media fieldissue-render
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:13000/health; then break; fi
            sleep 1
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/health)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/ready)" = 503
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/v1/issues)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/internal/analyze)" = 401
          docker exec fieldissue-render-smoke python3 -c '
          import urllib.request
          assert urllib.request.urlopen("http://127.0.0.1:8000/health").status == 200
          entries = open("/proc/net/tcp").read().splitlines()[1:]
          bindings = [line.split()[1] for line in entries if line.split()[1].endswith(":1F40")]
          assert bindings == ["0100007F:1F40"], bindings
          '
      - name: Verify bundled local embeddings under the free-instance memory limit
        run: |
          printf '{"texts":["A fallen tree blocks the path."]}' | docker exec -i fieldissue-render-smoke /app/intelligence/.venv/bin/python -m fieldissue_intelligence.embedding_worker > /tmp/fieldissue-embedding.json
          python3 -c 'import json,math; d=json.load(open("/tmp/fieldissue-embedding.json")); v=d["vectors"][0]; assert len(v)==384 and all(math.isfinite(x) for x in v); assert abs(sum(x*x for x in v)-1)<0.001'
      - name: Stop the whole service if the Python child exits
        run: |
          docker exec fieldissue-render-smoke python3 -c '
          import os, signal
          from pathlib import Path
          targets = [int(p.parent.name) for p in Path("/proc").glob("[0-9]*/cmdline") if p.read_bytes().split(b"\0")[1:3] == [b"-m", b"uvicorn"]]
          assert len(targets) == 1, targets
          os.kill(targets[0], signal.SIGTERM)
          '
          test "$(timeout 20 docker wait fieldissue-render-smoke)" = 1
      - name: Container diagnostics
        if: always()
        run: docker logs fieldissue-render-smoke 2>&1 || true
  backend:
    name: Docker, PostGIS and HTTP verification
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      COMPOSE_PROJECT_NAME: fieldissue-ci-${{ github.run_id }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Configure isolated development fixtures
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/fieldissue-ci"
          docker compose version
          docker compose config --quiet
      - name: Run complete API and Python tests
        run: make test 2>&1 | tee "$RUNNER_TEMP/fieldissue-ci/tests.log"
      - name: Check types and formatting
        run: make lint 2>&1 | tee "$RUNNER_TEMP/fieldissue-ci/lint.log"
      - name: Start, migrate and seed the development stack
        run: make dev 2>&1 | tee "$RUNNER_TEMP/fieldissue-ci/startup.log"
      - name: Verify actual PostGIS and pgvector extensions
        run: make verify-db 2>&1 | tee "$RUNNER_TEMP/fieldissue-ci/extensions.log"
      - name: Exercise the HTTP vertical slice
        run: node scripts/e2e.mjs | tee "$RUNNER_TEMP/fieldissue-ci/http-development.log"
      - name: Build and start the compiled runtime image
        # Test the production image with explicit development fixture settings.
        # This neither deploys the application nor claims live AI verification.
        run: |
          docker compose -f docker-compose.yml -f docker-compose.ci.yml up --build --wait api \
            2>&1 | tee "$RUNNER_TEMP/fieldissue-ci/runtime-build.log"
          docker compose exec -T api sh -c 'test ! -d node_modules/tsx && test -f apps/api/dist/index.js'
      - name: Exercise the compiled runtime over HTTP
        run: node scripts/e2e.mjs | tee "$RUNNER_TEMP/fieldissue-ci/http-runtime.log"
      - name: Collect container diagnostics
        if: always()
        run: |
          docker compose ps -a > "$RUNNER_TEMP/fieldissue-ci/containers.log"
          docker compose logs --no-color > "$RUNNER_TEMP/fieldissue-ci/services.log" 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: backend-verification-${{ github.run_id }}
          path: ${{ runner.temp }}/fieldissue-ci
          retention-days: 14
      - name: Remove isolated containers and volumes
        if: always()
        run: docker compose --profile tools down --volumes --remove-orphans
  mobile-corrections:
    name: Mobile correction journey (isolated fixtures)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TEST_DATABASE_URL: postgresql://fieldissue:fieldissue-test-only@127.0.0.1:55439/fieldissue_test
      FIELDISSUE_LOCAL_E2E: '1'
      FIELDISSUE_E2E_URL: http://127.0.0.1:3190
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Start isolated database and test-only provider
        run: |
          docker build -t fieldissue-mobile-db db
          docker run -d --name fieldissue-mobile-db -p 127.0.0.1:55439:5432 -e POSTGRES_USER=fieldissue -e POSTGRES_PASSWORD=fieldissue-test-only -e POSTGRES_DB=fieldissue_test fieldissue-mobile-db
          for i in $(seq 1 30); do
            if docker exec fieldissue-mobile-db pg_isready -U fieldissue -d fieldissue_test; then break; fi
            sleep 1
          done
          node scripts/revisit-test-server.mjs > /tmp/fieldissue-mobile.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3190/health; then break; fi
            sleep 1
          done
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: mobile-correction-evidence-${{ github.run_id }}
          path: |
            docs/verification/assets/revisit-*.png
            test-results
            /tmp/fieldissue-mobile.log
          retention-days: 14
      - name: Remove isolated database
        if: always()
        run: docker rm -f fieldissue-mobile-db
