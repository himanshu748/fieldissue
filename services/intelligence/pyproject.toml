[project]
name = "fieldissue-intelligence"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "starlette>=0.46,<1", "pydantic>=2.10,<3", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "sentry-sdk>=2.20,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9,<1"]
tabpfn = ["tabpfn>=2,<7", "numpy>=1.26,<3"]
training = ["tinker>=0.30.4,<1", "jinja2>=3.1.6,<4"]
semantic = [
    "huggingface-hub>=0.30,<2",
    "numpy>=1.26,<3",
    "onnxruntime>=1.20,<2",
    "tokenizers>=0.21,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fieldissue_intelligence"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
